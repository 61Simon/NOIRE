<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2ec" />
<title>NOIRÉ — Beyond The Ordinary</title>
<meta name="description" content="NOIRÉ — premium contemporary streetwear. Minimalist luxury, designed for everyday life." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}

:root{
  /* Light theme — default */
  --bg:#f5f2ec;
  --bg-alt:#ece7dd;
  --surface:#ffffff;
  --surface-2:#f0ebe1;
  --surface-3:#e6dfd2;

  --fg:#0a0a0a;
  --fg-soft:#37342f;
  --muted:#5f5b54;
  --dim:#928c82;
  --ghost:#b8b1a5;

  --line:rgba(10,10,10,.10);
  --line-2:rgba(10,10,10,.22);
  --line-3:rgba(10,10,10,.40);

  /* Dark theme — immersive sections only */
  --d-bg:#161616;
  --d-bg-2:#1e1e1e;
  --d-bg-3:#272727;
  --d-surface:#2a2a2a;
  --d-fg:#f5f2ec;
  --d-fg-soft:#d8d4cc;
  --d-muted:#a09c94;
  --d-dim:#6a6862;
  --d-line:rgba(245,242,236,.13);
  --d-line-2:rgba(245,242,236,.24);
  --d-line-3:rgba(245,242,236,.5);

  --warn:#a13f35;

  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --t-fast:.22s;
  --t:.38s;
  --t-slow:.7s;

  --hdr:68px;
  --pad:clamp(20px,4vw,56px);
}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background-color .4s var(--ease),color .4s var(--ease);
}
body.no-scroll{overflow:hidden}

img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
#root{min-height:100vh}

/* ==========================================================================
   LAYOUT
   ========================================================================== */
.wrap{width:100%;max-width:1580px;margin:0 auto;padding:0 var(--pad)}
.section{padding:clamp(76px,9vw,140px) 0}
.section-tight{padding:clamp(56px,6vw,88px) 0}

.eyebrow{
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--muted);
}
.h-xl{
  font-size:clamp(28px,4.4vw,56px);
  line-height:1.02;font-weight:400;letter-spacing:-.005em;
  text-transform:uppercase;
}
.h-lg{
  font-size:clamp(20px,2.6vw,32px);
  line-height:1.15;font-weight:400;letter-spacing:.01em;
  text-transform:uppercase;
}
.h-sm{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;
}
.muted{color:var(--muted)}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  height:52px;padding:0 34px;
  border:1px solid var(--line-2);
  background:transparent;
  color:var(--fg);
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;
  overflow:hidden;white-space:nowrap;isolation:isolate;
  transition:
    color var(--t) var(--ease),
    border-color var(--t) var(--ease),
    background-color var(--t) var(--ease),
    transform var(--t-fast) var(--ease);
}
.btn>span{position:relative;z-index:2}
.btn::before{
  content:'';position:absolute;inset:0;background:var(--fg);z-index:1;
  transform:translateY(101%);
  transition:transform .48s var(--ease);
}
.btn:hover{color:var(--bg);border-color:var(--fg)}
.btn:hover::before{transform:translateY(0)}
.btn:active{transform:translateY(1px);transition-duration:.08s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled::before{display:none}

.btn-solid{
  background:var(--fg);color:var(--bg);border-color:var(--fg);
}
.btn-solid::before{background:var(--bg)}
.btn-solid:hover{color:var(--fg);border-color:var(--fg)}
.btn-solid:hover::before{transform:translateY(0)}

.btn-sm{height:42px;padding:0 22px;font-size:10px;letter-spacing:.22em}
.btn-block{width:100%}

/* On dark surfaces */
.btn-on-dark{
  border-color:var(--d-line-3);color:var(--d-fg);
}
.btn-on-dark::before{background:var(--d-fg)}
.btn-on-dark:hover{color:#161616;border-color:var(--d-fg)}
.btn-on-dark.btn-solid{
  background:var(--d-fg);color:#161616;border-color:var(--d-fg);
}
.btn-on-dark.btn-solid::before{background:transparent}
.btn-on-dark.btn-solid:hover{background:transparent;color:var(--d-fg);border-color:var(--d-fg)}

.u-link{
  position:relative;display:inline-block;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);
  transition:color var(--t) var(--ease);
}
.u-link::after{
  content:'';position:absolute;left:0;bottom:-4px;height:1px;width:100%;
  background:currentColor;transform:scaleX(0);transform-origin:left;
  transition:transform .5s var(--ease);
}
.u-link:hover{color:var(--fg)}
.u-link:hover::after{transform:scaleX(1)}

/* ==========================================================================
   REVEAL
   ========================================================================== */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out)}
.reveal.is-in{opacity:1;transform:none}
.page-enter{animation:pageIn .45s var(--ease-out) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==========================================================================
   HEADER
   ========================================================================== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:120;
  border-bottom:1px solid transparent;
  color:var(--fg);
  background:transparent;
  transition:background-color .4s var(--ease),border-color .4s var(--ease),color .25s var(--ease);
}
.header.is-solid{
  background:rgba(245,242,236,.9);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-bottom-color:var(--line);
  color:var(--fg);
}
.header.on-hero{color:var(--d-fg)}
.header.on-hero .logo,
.header.on-hero .main-nav a,
.header.on-hero .icon-btn{color:var(--d-fg)}
.header.on-hero .currency-toggle{border-color:var(--d-line-2);color:var(--d-fg)}
.header.on-hero .currency-toggle button.is-active{background:var(--d-fg);color:#161616}
.header.on-hero .cart-count{background:var(--d-fg);color:#161616}

.header-inner{
  position:relative;height:var(--hdr);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}

.logo{
  font-size:18px;letter-spacing:.4em;font-weight:500;
  text-transform:uppercase;line-height:1;
  transition:opacity var(--t) var(--ease);
  padding-right:3px;
}
.logo:hover{opacity:.7}

.main-nav{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;gap:38px;
}
.main-nav a{
  position:relative;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  opacity:.72;padding:4px 0;
  transition:opacity var(--t) var(--ease);
}
.main-nav a::after{
  content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
  background:currentColor;transform:scaleX(0);transform-origin:left;
  transition:transform .4s var(--ease);
}
.main-nav a:hover{opacity:1}
.main-nav a:hover::after{transform:scaleX(1)}
.main-nav a.is-active{opacity:1}
.main-nav a.is-active::after{transform:scaleX(1)}

.header-actions{display:flex;align-items:center;gap:2px}
.icon-btn{
  position:relative;width:40px;height:40px;display:grid;place-items:center;
  opacity:.88;
  transition:opacity var(--t) var(--ease),transform var(--t-fast) var(--ease);
}
.icon-btn:hover{opacity:1;transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0);opacity:.7}
.cart-count{
  position:absolute;top:2px;right:2px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--fg);color:var(--bg);
  font-size:9px;font-weight:600;line-height:16px;
  text-align:center;border-radius:999px;
  animation:popIn .3s var(--ease-out);
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

.currency-toggle{
  display:flex;align-items:center;height:28px;margin:0 8px;
  border:1px solid var(--line-2);border-radius:2px;overflow:hidden;
  transition:border-color var(--t) var(--ease);
}
.currency-toggle button{
  padding:0 10px;height:100%;
  font-size:9.5px;letter-spacing:.2em;font-weight:500;
  color:currentColor;opacity:.6;
  transition:opacity var(--t-fast) var(--ease),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.currency-toggle button:hover{opacity:.95}
.currency-toggle button.is-active{opacity:1;background:var(--fg);color:var(--bg)}

.menu-btn{display:none}
@media (max-width:1080px){
  .main-nav{display:none}
  .menu-btn{display:grid}
}
@media (max-width:520px){
  .currency-toggle{margin:0 2px}
  .currency-toggle button{padding:0 7px;font-size:9px}
}

/* ==========================================================================
   MOBILE MENU
   ========================================================================== */
.mobile-menu{
  position:fixed;inset:0;z-index:130;
  background:var(--d-bg);color:var(--d-fg);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(var(--hdr) + 30px) var(--pad) 40px;
  opacity:0;visibility:hidden;
  transition:opacity .4s var(--ease),visibility .4s;
}
.mobile-menu.is-open{opacity:1;visibility:visible}
.mm-close{
  position:absolute;top:14px;right:var(--pad);
  width:40px;height:40px;display:grid;place-items:center;color:var(--d-fg);
  transition:opacity var(--t) var(--ease);
}
.mm-close:hover{opacity:.7}
.mm-nav{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.mm-link{
  text-align:left;
  font-size:clamp(28px,8.5vw,44px);
  line-height:1.14;letter-spacing:.01em;
  text-transform:uppercase;font-weight:400;
  color:var(--d-fg);
  opacity:0;transform:translateY(16px);
  transition:opacity .55s var(--ease-out),transform .55s var(--ease-out),color var(--t) var(--ease);
  padding:6px 0;border-bottom:1px solid var(--d-line);
}
.mobile-menu.is-open .mm-link{opacity:1;transform:none}
.mm-link:hover{color:var(--d-muted)}
.mm-foot{
  display:flex;flex-wrap:wrap;gap:22px;align-items:center;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--d-dim);
}
.mm-foot button{transition:color var(--t) var(--ease)}
.mm-foot button:hover{color:var(--d-fg)}

/* ==========================================================================
   HERO
   ========================================================================== */
.hero{
  position:relative;height:100svh;min-height:640px;
  overflow:hidden;background:#0d0d0d;
}
.hero-media{position:absolute;inset:0}
.hero-media img{
  width:100%;height:100%;object-fit:cover;object-position:58% 22%;
  animation:heroFade 1.4s var(--ease-out) both;
}
@keyframes heroFade{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
.hero-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.84) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,.2) 100%),
    linear-gradient(0deg,rgba(0,0,0,.76) 0%,rgba(0,0,0,0) 55%);
}
.hero-content{
  position:relative;z-index:3;height:100%;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:clamp(88px,12vh,132px);
  color:#fff;
}
.hero-eyebrow{
  font-size:9.5px;letter-spacing:.38em;text-transform:uppercase;
  color:rgba(255,255,255,.66);margin-bottom:22px;
}
.hero-title{display:flex;flex-direction:column;gap:2px;font-weight:400;max-width:1120px}
.hero-brand{
  font-size:clamp(46px,8.2vw,124px);
  line-height:.92;letter-spacing:.06em;font-weight:300;
}
.hero-sub{
  font-size:clamp(16px,2.8vw,42px);
  line-height:1.12;letter-spacing:.05em;color:rgba(255,255,255,.94);
}
.hero-caption{
  margin-top:26px;
  font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(255,255,255,.66);
}
.hero-cta{margin-top:40px}
.hero-eyebrow,.hero-title,.hero-caption,.hero-cta{animation:heroUp 1s var(--ease-out) both}
.hero-title{animation-delay:.08s}
.hero-caption{animation-delay:.2s}
.hero-cta{animation-delay:.3s}
@keyframes heroUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.hero-scroll{
  position:absolute;right:var(--pad);bottom:34px;z-index:3;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;
  animation:heroUp 1s var(--ease-out) .55s both;
}
.hero-scroll span:first-child{
  font-size:9px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.66);
}
.hero-scroll-line{
  position:relative;width:1px;height:58px;
  background:rgba(255,255,255,.2);overflow:hidden;
}
.hero-scroll-line::after{
  content:'';position:absolute;left:0;top:-60%;width:1px;height:60%;
  background:#fff;animation:scrollDot 2.4s var(--ease) infinite;
}
@keyframes scrollDot{0%{top:-60%}60%,100%{top:110%}}
@media (max-width:760px){.hero-scroll{display:none}}

/* ==========================================================================
   SECTION HEAD
   ========================================================================== */
.sec-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;
  padding-bottom:28px;border-bottom:1px solid var(--line);
  margin-bottom:clamp(34px,4vw,52px);
}
.sec-head-left{display:flex;align-items:baseline;gap:26px;flex-wrap:wrap}
.sec-head .h-xl{line-height:.95}

/* ==========================================================================
   PRODUCT GRID / CARD
   ========================================================================== */
.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:clamp(28px,3vw,48px) clamp(12px,1.4vw,20px);
}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
  .grid,.grid-3{grid-template-columns:repeat(2,1fr);gap:30px 12px}
}

.card{
  position:relative;display:flex;flex-direction:column;text-align:left;
  cursor:pointer;
}
.card-media{
  position:relative;display:block;width:100%;
  aspect-ratio:3/4;overflow:hidden;
  background:var(--surface-2);
}
.card-media img{
  width:100%;height:100%;object-fit:cover;
  transition:opacity .5s var(--ease-out),transform 1.2s var(--ease-out);
}
.card-media .img-a{position:relative;z-index:1}
.card-media .img-b{position:absolute;inset:0;z-index:2;opacity:0}
.card:hover .img-b{opacity:1}
.card:hover .card-media img{transform:scale(1.04)}

.card-badge{
  position:absolute;top:12px;left:12px;z-index:6;
  padding:5px 10px;
  background:var(--fg);color:var(--bg);
  font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;
}
.card-wish{
  position:absolute;top:11px;right:11px;z-index:6;
  width:36px;height:36px;display:grid;place-items:center;
  background:rgba(255,255,255,.95);color:var(--fg);
  opacity:0;transform:translateY(-5px);
  transition:opacity var(--t) var(--ease-out),transform var(--t) var(--ease-out),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.card:hover .card-wish{opacity:1;transform:none}
.card-wish:hover{background:var(--fg);color:var(--bg)}
.card-wish.is-active{opacity:1;transform:none;background:var(--fg);color:var(--bg)}
@media (hover:none){.card-wish{opacity:1;transform:none}}

.quick-add{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:6;height:44px;
  background:rgba(10,10,10,.94);color:#f5f2ec;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;
  opacity:0;transform:translateY(10px);
  transition:opacity var(--t) var(--ease-out),transform var(--t) var(--ease-out),background var(--t-fast) var(--ease);
}
.quick-add:hover{background:#000}
.quick-add:active{transform:translateY(9px)}
.card:hover .quick-add{opacity:1;transform:none}
@media (hover:none){.quick-add{opacity:1;transform:none}}

.card-info{padding-top:16px;display:flex;flex-direction:column;gap:6px}
.card-name{
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
  transition:opacity var(--t) var(--ease);
}
.card:hover .card-name{opacity:.72}
.card-price{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.card-colors{display:flex;gap:6px;margin-top:6px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(128,128,128,.45)}

/* ==========================================================================
   EDITORIAL BANNER
   ========================================================================== */
.editorial{
  position:relative;min-height:min(88vh,820px);
  display:flex;align-items:center;overflow:hidden;
  background:var(--d-bg);color:var(--d-fg);
}
.editorial img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;object-position:center 35%;
}
.editorial-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.76));
}
.editorial-content{
  position:relative;z-index:3;width:100%;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:110px 0;
}
.editorial-title{
  font-size:clamp(30px,6vw,82px);
  line-height:.98;letter-spacing:.03em;text-transform:uppercase;font-weight:300;
}
.editorial-sub{
  font-size:clamp(10px,1.3vw,13px);
  letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.76);line-height:2;
}

/* ==========================================================================
   ABOUT
   ========================================================================== */
.about-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(32px,6vw,96px);align-items:center;
}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}}
.about-media{
  position:relative;aspect-ratio:4/5;overflow:hidden;
  background:var(--surface-2);
}
.about-media img{width:100%;height:100%;object-fit:cover}
.about-text p{
  max-width:52ch;color:var(--muted);font-size:15px;line-height:1.85;
}
.principles{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:clamp(56px,7vw,96px);
  border-top:1px solid var(--line);padding-top:36px;
}
@media (max-width:700px){.principles{grid-template-columns:1fr;gap:22px}}
.principle{display:flex;flex-direction:column;gap:12px}
.principle .num{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.principle .ttl{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}

/* ==========================================================================
   PAGE
   ========================================================================== */
.page{padding-top:var(--hdr)}
.page-head{
  padding:clamp(48px,7vw,88px) 0 clamp(32px,4vw,52px);
  border-bottom:1px solid var(--line);
}
.page-head .h-xl{margin-bottom:20px}
.page-head p{max-width:56ch;color:var(--muted);font-size:14px;line-height:1.85}

/* ==========================================================================
   CATALOG
   ========================================================================== */
.catalog-layout{
  display:grid;grid-template-columns:240px 1fr;
  gap:clamp(28px,4vw,64px);align-items:start;
  padding-top:clamp(32px,4vw,54px);
  padding-bottom:clamp(76px,9vw,140px);
}
.filters-desktop{position:sticky;top:calc(var(--hdr) + 24px)}
.filter-group{border-bottom:1px solid var(--line);padding:22px 0}
.filter-group:first-child{padding-top:0}
.filter-title{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--fg);
  margin-bottom:16px;font-weight:500;
}
.filter-list{display:flex;flex-direction:column;gap:10px}
.filter-opt{
  display:flex;align-items:center;gap:10px;text-align:left;
  font-size:12.5px;letter-spacing:.04em;color:var(--muted);
  transition:color var(--t) var(--ease);
}

/* REVEAL */
function Reveal({ children, delay = 0, className = '', style, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setShown(true); return; }
    const io = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setShown(true); io.disconnect(); } },
      { threshold: 0.1, rootMargin: '0px 0px -60px 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <div
      ref={ref}
      className={`reveal ${shown ? 'is-in' : ''} ${className}`}
      style={{ transitionDelay: `${delay}ms`, ...style }}
      {...rest}
    >
      {children}

  );
}

    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return path;
}

function readLS(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeLS(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function normalizeCart(raw) {
  if (!Array.isArray(raw)) return [];
  const seen = new Set();
  return raw.reduce((acc, it) => {
    if (!it || typeof it !== 'object') return acc;
    const rawPrice = it.priceEUR != null ? it.priceEUR : it.price;
    const priceEUR = Number(rawPrice);
    const qty = Number(it.qty);
    if (!Number.isFinite(priceEUR) || priceEUR <= 0) return acc;
    if (!Number.isFinite(qty) || qty <= 0) return acc;
    const id = it.id != null ? String(it.id) : null;
    const size = it.size || null;
    const color = it.color || null;
    const key = String(it.key || `${id || 'x'}|${size || '-'}|${color || '-'}`);
    if (seen.has(key)) return acc;
    seen.add(key);
    acc.push({
      key, id,
      name: String(it.name || 'Item'),
      priceEUR,
      image: it.image || '',
      size, color,
      qty: Math.min(99, Math.max(1, Math.round(qty))),
    });
    return acc;
  }, []);
}

    return stored && CURRENCIES[stored] ? stored : DEFAULT_CURRENCY;
  });

  useEffect(() => { writeLS('noire:cart', cart); }, [cart]);
  useEffect(() => { writeLS('noire:wishlist', wishlist); }, [wishlist]);
  useEffect(() => { writeLS('noire:currency', currency); }, [currency]);

  const anyOpen = cartOpen || searchOpen || menuOpen;
  useEffect(() => {
    document.body.classList.toggle('no-scroll', anyOpen);
    return () => document.body.classList.remove('no-scroll');
  }, [anyOpen]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { setCartOpen(false); setSearchOpen(false); setMenuOpen(false); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const showToast = useCallback((message) => {
    setToast(message);
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(null), 2800);
  }, []);

  const addToCart = useCallback((product, { size = null, color = null, qty = 1 } = {}) => {
    const priceEUR = Number(product.price);
    if (!Number.isFinite(priceEUR) || priceEUR <= 0) return;
    const key = `${product.id}|${size || '-'}|${color || '-'}`;
    const safeQty = Math.max(1, Math.min(99, Math.round(Number(qty) || 1)));
    setCart((prev) => {
      const idx = prev.findIndex((it) => it.key === key);
      if (idx > -1) {
        const copy = prev.slice();
        copy[idx] = { ...copy[idx], qty: Math.min(99, copy[idx].qty + safeQty) };
        return copy;
      }
      return [...prev, {
        key,
        id: product.id,
        name: product.name,
        priceEUR,
        image: product.images[0],
        size, color, qty: safeQty,
      }];
    });
  }, []);

  const updateQty = useCallback((key, delta) => {
    setCart((prev) => prev.flatMap((it) => {
      if (it.key !== key) return [it];
      const next = it.qty + delta;
      if (next <= 0) return [];
      return [{ ...it, qty: Math.min(99, next) }];
    }));
  }, []);

  const removeItem = useCallback((key) => {
    setCart((prev) => prev.filter((it) => it.key !== key));
  }, []);

  const clearCart = useCallback(() => setCart([]), []);

  const toggleWishlist = useCallback((id) => {
    setWishlist((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  }, []);
  const isWished = useCallback((id) => wishlist.includes(id), [wishlist]);

  const formatPrice = useCallback((eurAmount) => {
    const c = CURRENCIES[currency] || CURRENCIES[DEFAULT_CURRENCY];
    const n = Number(eurAmount);
    const safe = Number.isFinite(n) ? n : 0;
    const converted = Math.round(safe * c.rate);
    return c.symbol + converted.toLocaleString('en-US');
  }, [currency]);

  const cartCount = cart.reduce((s, it) => s + it.qty, 0);
  const subtotalEUR = cart.reduce((s, it) => {
    const p = Number(it.priceEUR);
    return s + (Number.isFinite(p) ? p : 0) * it.qty;
  }, 0);

  const value = {
    cart, cartOpen, setCartOpen,
    searchOpen, setSearchOpen,
    menuOpen, setMenuOpen,
    wishlist, toggleWishlist, isWished,
    addToCart, updateQty, removeItem, clearCart,
    cartCount, subtotalEUR,
    currency, setCurrency,
    formatPrice,
    toast, showToast,
  };

  return <ShopContext.Provider value={value}>{children}</ShopContext.Provider>;
}

/* CATALOG */
const SORT_OPTIONS = [
  { value: 'featured', label: 'FEATURED' },
  { value: 'newest', label: 'NEWEST' },
  { value: 'price-asc', label: 'PRICE: LOW TO HIGH' },
  { value: 'price-desc', label: 'PRICE: HIGH TO LOW' },
];

function CatalogPage({ onlyNew = false, presetCategory = null }) {
  const [category, setCategory] = useState(presetCategory || 'All');
  const [sizes, setSizes] = useState([]);
  const [colors, setColors] = useState([]);
  const [priceMin, setPriceMin] = useState(PRICE_MIN);
  const [priceMax, setPriceMax] = useState(PRICE_MAX);
  const [sort, setSort] = useState('featured');
  const [mobileFilters, setMobileFilters] = useState(false);

  useEffect(() => { setCategory(presetCategory || 'All'); }, [presetCategory]);

  useEffect(() => {
    document.body.classList.toggle('no-scroll', mobileFilters);
    return () => document.body.classList.remove('no-scroll');
  }, [mobileFilters]);

  const toggleSize = (s) =>
    setSizes((prev) => prev.includes(s) ? prev.filter((x) => x !== s) : [...prev, s]);
  const toggleColor = (c) =>
    setColors((prev) => prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]);

  const clearAll = () => {
    setCategory('All');
    setSizes([]);
    setColors([]);
    setPriceMin(PRICE_MIN);
    setPriceMax(PRICE_MAX);
  };

  const results = useMemo(() => {
    let list = PRODUCTS.filter((p) => {
      if (onlyNew && !p.isNew) return false;
      if (category !== 'All' && p.category !== category) return false;
      if (sizes.length > 0 && !sizes.some((s) => p.sizes.includes(s))) return false;
      if (colors.length > 0 && !colors.some((c) => p.colors.includes(c))) return false;
      if (p.price < priceMin || p.price > priceMax) return false;
      return true;
    });

    switch (sort) {
      case 'newest':
        list = list.slice().sort((a, b) => b._i - a._i);
        break;
      case 'price-asc':
        list = list.slice().sort((a, b) => a.price - b.price);
        break;
      case 'price-desc':
        list = list.slice().sort((a, b) => b.price - a.price);
        break;
      default:
        list = list.slice().sort((a, b) => a._i - b._i);
    }
    return list;
  }, [onlyNew, category, sizes, colors, priceMin, priceMax, sort]);

  const openProduct = useCallback((p) => navigate(`/product/${p.id}`), []);
  const filtersActive = category !== 'All' || sizes.length > 0 || colors.length > 0 ||
    priceMin !== PRICE_MIN || priceMax !== PRICE_MAX;

  const filterProps = {
    category, setCategory,
    sizes, toggleSize,
    colors, toggleColor,
    priceMin, priceMax, setPriceMin, setPriceMax,
    onClear: clearAll,
    resultCount: results.length,
  };

  return (
    <div className="page-enter">
      <div className="page wrap">
        <div className="page-head">
          <p className="eyebrow" style={{ marginBottom: 18 }}>
            {onlyNew ? 'LATEST DROP' : 'THE COLLECTION'}
          </p>
          <h1 className="h-xl">{onlyNew ? 'NEW ARRIVALS' : 'CLOTHING'}</h1>
          <p>
            Considered garments built from premium materials and cut with restraint.
            Designed to be worn daily, season after season.
          </p>
        </div>

        <div className="catalog-layout">
          <aside className="filters-desktop" aria-label="Product filters">
            <FilterContent {...filterProps} />
          </aside>

          <main>
            <div className="mobile-filter-bar">
              <button className="btn btn-sm" onClick={() => setMobileFilters(true)}>
                <Icon name="sliders" size={14} />
                <span style={{ marginLeft: 10 }}>FILTERS{filtersActive ? ' •' : ''}</span>
              </button>
            </div>

            <div className="catalog-bar">
              <span className="catalog-count">
                {results.length} {results.length === 1 ? 'ITEM' : 'ITEMS'}
              </span>
              <div className="sort-wrap">
                <label htmlFor="sort">SORT</label>
                <select
                  id="sort"
                  className="sort-select"
                  value={sort}
                  onChange={(e) => setSort(e.target.value)}
                >
                  {SORT_OPTIONS.map((o) => (
                    <option key={o.value} value={o.value}>{o.label}</option>
                  ))}
                </select>
              </div>
            </div>

            {results.length > 0 ? (
              <ProductGrid products={results} onOpen={openProduct} />
            ) : (
              <div className="empty-state">
                <p className="h-lg">NO PRODUCTS FOUND</p>
                <p className="muted" style={{ maxWidth: '42ch' }}>
                  Nothing matches your current filters. Try removing a filter or widening the price range.
                </p>
                <button className="btn btn-solid" onClick={clearAll}><span>CLEAR ALL FILTERS</span></button>
              </div>
            )}
          </main>
        </div>
      </div>

      <div
        className={`filters-mobile ${mobileFilters ? 'is-open' : ''}`}
        aria-hidden={!mobileFilters}
      >
        <FilterContent {...filterProps} onClose={() => setMobileFilters(false)} />
      </div>
    </div>
  );
}

function ProductPage({ id }) {
  const { addToCart, setCartOpen, showToast, isWished, toggleWishlist, formatPrice } = useShop();
  const product = getProduct(id);

  const [activeImg, setActiveImg] = useState(0);
  const [color, setColor] = useState(product ? product.colors[0] : null);
  const [size, setSize] = useState(null);
  const [qty, setQty] = useState(1);
  const [error, setError] = useState('');
  const [sizeGuide, setSizeGuide] = useState(false);

  useEffect(() => {
    setActiveImg(0);
    setColor(product ? product.colors[0] : null);
    setSize(null);
    setQty(1);
    setError('');
  }, [id]);

  useEffect(() => {
    document.body.classList.toggle('no-scroll', sizeGuide);
    return () => document.body.classList.remove('no-scroll');
  }, [sizeGuide]);

  const related = useMemo(() => {
    if (!product) return [];
    const sameCat = PRODUCTS.filter((p) => p.id !== product.id && p.category === product.category);
    const others = PRODUCTS.filter((p) => p.id !== product.id && p.category !== product.category);
    return [...sameCat, ...others].slice(0, 4);
  }, [product]);

  if (!product) {
    return <NotFoundPage />;
  }

  const needsSize = product.sizes.length > 0;
  const wished = isWished(product.id);

  const handleAdd = () => {
    if (needsSize && !size) {
      setError('Please select a size before adding to bag.');
      return;
    }
    setError('');
    addToCart(product, { size, color, qty });
    showToast(`${product.name} added to bag`);
    setCartOpen(true);
  };

  return (
    <div className="page-enter">
      <div className="page wrap">
        <div className="pdp">
          <div className="pdp-gallery">
            <div className="pdp-main">
              <SmartImage
                key={activeImg}
                src={product.images[activeImg]}
                alt={`${product.name} — view ${activeImg + 1}`}
              />
            </div>
            {product.images.length > 1 && (
              <div className="pdp-thumbs">
                {product.images.map((src, i) => (
                  <button
                    key={src + i}

/* SEARCH */
const SUGGESTIONS = ['Hoodie', 'Jacket', 'Pants', 'T-Shirt', 'Accessories'];

function SearchOverlay() {
  const { searchOpen, setSearchOpen, addToCart, setCartOpen, showToast } = useShop();
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    if (searchOpen) {
      setQuery('');
      window.setTimeout(() => inputRef.current && inputRef.current.focus(), 220);
    }
  }, [searchOpen]);

  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return PRODUCTS.filter((p) =>
      p.name.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q) ||
      p.colors.some((c) => c.toLowerCase().includes(q))
    );
  }, [query]);

  const handleQuickAdd = (product) => {
    if (product.sizes.length > 0) {
      setSearchOpen(false);
      navigate(`/product/${product.id}`);
      return;
    }
    addToCart(product, { color: product.colors[0] });
    setSearchOpen(false);
    setCartOpen(true);
    showToast(`${product.name} added to bag`);
  };

  return (
    <div className={`search-overlay ${searchOpen ? 'is-open' : ''}`} aria-hidden={!searchOpen}>
      <div className="search-top">
        <span className="eyebrow" style={{ color: 'var(--d-muted)' }}>SEARCH</span>
        <button className="icon-btn" onClick={() => setSearchOpen(false)} aria-label="Close search" tabIndex={searchOpen ? 0 : -1}>
          <Icon name="close" size={20} />
        </button>
      </div>

      <div className="search-field">
        <Icon name="search" size={22} stroke={1.2} />
        <input
          ref={inputRef}
          type="search"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="SEARCH PRODUCTS"
          aria-label="Search products"
          tabIndex={searchOpen ? 0 : -1}
        />
      </div>

      <div className="search-results">
        {!query && (
          <>
            <p className="search-hint">POPULAR SEARCHES</p>
            <div className="search-chips">
              {SUGGESTIONS.map((s) => (
                <button key={s} className="search-chip" onClick={() => setQuery(s)} tabIndex={searchOpen ? 0 : -1}>
                  {s}
                </button>
              ))}
            </div>
          </>
        )}

        {query && results.length === 0 && (
          <div className="search-empty">
            <p className="h-lg">NO PRODUCTS FOUND</p>
            <p className="muted" style={{ maxWidth: '46ch', color: 'var(--d-muted)' }}>
              We couldn't find anything matching “{query}”. Try a different term,
              or browse the full collection.
            </p>
            <div className="search-chips">
              {SUGGESTIONS.map((s) => (
                <button key={s} className="search-chip" onClick={() => setQuery(s)} tabIndex={searchOpen ? 0 : -1}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        )}

        {query && results.length > 0 && (
          <>
            <p className="search-hint">{results.length} RESULT{results.length === 1 ? '' : 'S'}</p>
            <div className="search-grid">
              {results.map((p) => (
                <ProductCard
                  key={p.id}
                  product={p}
                  onQuickAdd={handleQuickAdd}
                  onOpen={(prod) => { setSearchOpen(false); navigate(`/product/${prod.id}`); }}
                />
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* CHECKOUT */
function CheckoutPage() {
  const { cart, subtotalEUR, cartCount, clearCart, formatPrice } = useShop();
  const [form, setForm] = useState({ email: '', name: '', address: '', city: '', zip: '' });
  const [errors, setErrors] = useState({});
  const [done, setDone] = useState(false);

  const shippingEUR = subtotalEUR >= 200 || subtotalEUR === 0 ? 0 : 9;
  const totalEUR = subtotalEUR + shippingEUR;

  const update = (k, v) => {
    setForm((f) => ({ ...f, [k]: v }));
    setErrors((e) => ({ ...e, [k]: '' }));
  };

  const submit = (e) => {
    e.preventDefault();
    const next = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email)) next.email = 'Enter a valid email address.';
    if (form.name.trim().length < 2) next.name = 'Enter your full name.';
    if (form.address.trim().length < 4) next.address = 'Enter your street address.';
    if (form.city.trim().length < 2) next.city = 'Enter your city.';
    if (form.zip.trim().length < 3) next.zip = 'Enter a valid postal code.';
    setErrors(next);
    if (Object.keys(next).length === 0) {
      setDone(true);
      clearCart();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  if (done) {
    return (
      <div className="page-enter">
        <div className="page wrap">
          <div className="info-page" style={{ maxWidth: 620 }}>
            <p className="eyebrow" style={{ marginBottom: 20 }}>DEMO COMPLETE</p>
            <h1 className="h-xl" style={{ marginBottom: 24 }}>ORDER SIMULATED</h1>
            <p style={{ lineHeight: 1.9 }}>
              This is a front-end demonstration. No payment was processed and no order
              was created on a server. In a production build this step would hand off to
              a payment provider and a backend order service.
            </p>
            <button className="btn btn-solid" style={{ marginTop: 32 }} onClick={() => navigate('/clothing')}>
              <span>CONTINUE SHOPPING</span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (cart.length === 0) {
    return (
      <div className="page-enter">
        <div className="page wrap">
          <div className="info-page" style={{ maxWidth: 620 }}>
            <p className="eyebrow" style={{ marginBottom: 20 }}>CHECKOUT</p>
            <h1 className="h-xl" style={{ marginBottom: 24 }}>YOUR BAG IS EMPTY</h1>
            <p>Add a piece to your bag before proceeding to checkout.</p>
            <button className="btn btn-solid" style={{ marginTop: 32 }} onClick={() => navigate('/clothing')}>
              <span>CONTINUE SHOPPING</span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="page-enter">
      <div className="page wrap">
        <div className="page-head">
          <p className="eyebrow" style={{ marginBottom: 18 }}>STEP 1 OF 1</p>
          <h1 className="h-xl">CHECKOUT</h1>
        </div>

        <div className="checkout-layout">
          <form onSubmit={submit} noValidate>
            <div className="notice" style={{ marginBottom: 34 }}>
              <strong>DEMONSTRATION CHECKOUT.</strong> No payment is processed and no data
              leaves your browser. All fields are validated locally only.
            </div>

            <h2 className="h-sm" style={{ marginBottom: 20 }}>CONTACT</h2>
            <div className="field">
              <label htmlFor="email">EMAIL</label>
              <input
                id="email"
                type="email"
                value={form.email}
                onChange={(e) => update('email', e.target.value)}
                className={errors.email ? 'err' : ''}
                placeholder="you@example.com"
              />
              {errors.email && <span className="field-error">{errors.email}</span>}
            </div>

            <h2 className="h-sm" style={{ margin: '38px 0 20px' }}>SHIPPING ADDRESS</h2>
            <div className="field">
              <label htmlFor="name">FULL NAME</label>
              <input
                id="name"
                value={form.name}
                onChange={(e) => update('name', e.target.value)}
                className={errors.name ? 'err' : ''}
              />
              {errors.name && <span className="field-error">{errors.name}</span>}
            </div>
            <div className="field">
              <label htmlFor="address">STREET ADDRESS</label>
              <input
                id="address"
                value={form.address}
                onChange={(e) => update('address', e.target.value)}
                className={errors.address ? 'err' : ''}
              />
              {errors.address && <span className="field-error">{errors.address}</span>}
            </div>
            <div className="form-grid">
              <div className="field">
                <label htmlFor="city">CITY</label>
                <input
                  id="city"
                  value={form.city}
                  onChange={(e) => update('city', e.target.value)}
                  className={errors.city ? 'err' : ''}
                />
                {errors.city && <span className="field-error">{errors.city}</span>}
              </div>
              <div className="field">
                <label htmlFor="zip">POSTAL CODE</label>
                <input
                  id="zip"
                  value={form.zip}
                  onChange={(e) => update('zip', e.target.value)}
                  className={errors.zip ? 'err' : ''}
                />
                {errors.zip && <span className="field-error">{errors.zip}</span>}
              </div>
            </div>

            <button type="submit" className="btn btn-solid btn-block" style={{ marginTop: 20 }}>
              <span>PLACE DEMO ORDER — {formatPrice(totalEUR)}</span>
            </button>
          </form>

          <aside className="summary-box">
            <h2 className="h-sm" style={{ marginBottom: 20 }}>ORDER SUMMARY ({cartCount})</h2>
            {cart.map((it) => (
              <div className="summary-line" key={it.key}>
                <span>
                  {it.name}
                  {it.size ? ` · ${it.size}` : ''}
                  {it.color ? ` · ${it.color}` : ''} × {it.qty}
                </span>
                <span>{formatPrice(it.priceEUR * it.qty)}</span>
              </div>
            ))}
            <div className="summary-line"><span>Shipping</span><span>{shippingEUR === 0 ? 'Complimentary' : formatPrice(shippingEUR)}</span></div>
            <div className="summary-total"><span>Total</span><span>{formatPrice(totalEUR)}</span></div>
          </aside>
        </div>
      </div>
    </div>
  );
}

/* NEWSLETTER */
function Newsletter() {
  const [email, setEmail] = useState('');
  const [message, setMessage] = useState(null);

  const submit = (e) => {
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
    if (!valid) {
      setMessage({ type: 'err', text: 'Please enter a valid email address.' });
      return;
    }
    setMessage({
      type: 'ok',
      text: 'Demo only — no address was sent or stored on a server.',
    });
    setEmail('');
  };

  return (
    <div className="footer-col">
      <h4>NEWSLETTER</h4>
      <p style={{ fontSize: 12.5, color: 'var(--d-muted)', lineHeight: 1.8, marginBottom: 14 }}>
        Early access to new pieces and collection drops.
      </p>
      <form className="nl-form" onSubmit={submit} noValidate>
        <input
          type="email"
          value={email}
          onChange={(e) => { setEmail(e.target.value); setMessage(null); }}
          placeholder="Email address"
          aria-label="Email address"
        />
        <button type="submit">SUBSCRIBE</button>
      </form>
      <div className={`nl-msg ${message ? message.type : ''}`} role="status">
        {message ? message.text : ''}
      </div>
    </div>
  );
}

/* SHELL */
function Shell() {
  const path = useRoute();
  const parts = path.split('/').filter(Boolean);
  const seg = parts[0] || '';
  const param = parts[1] || null;

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, [path]);

  let page;
  let isNotFound = false;

  switch (seg) {
    case '':
      page = <HomePage />;
      break;
    case 'clothing':
      page = <CatalogPage key={param || 'all'} presetCategory={param || null} />;
      break;
    case 'new-arrivals':
      page = <CatalogPage onlyNew />;
      break;
    case 'collections':
      page = <CollectionsPage />;
      break;
    case 'about':
      page = <AboutPage />;
      break;
    case 'product':
      page = <ProductPage id={param} />;
      break;
    case 'wishlist':
      page = <WishlistPage />;
      break;
    case 'checkout':
      page = <CheckoutPage />;
      break;
    case 'contact':
    case 'shipping':
    case 'size-guide':
    case 'privacy':
      page = <InfoPage slug={seg} />;
      break;
    default:
      isNotFound = true;
      page = <NotFoundPage />;
  }

  if (isNotFound) {
    return (
      <>
        <Header path={path} />
        <main key={path}>{page}</main>
      </>
    );
  }

  return (
    <>
      <Header path={path} />
      <MobileMenu />
      <main key={path}>{page}</main>
      <Footer />
      <ShoppingCart />
      <SearchOverlay />
      <Toast />
    </>
  );
}

function App() {
  return (
    <ShopProvider>
      <Shell />
    </ShopProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
