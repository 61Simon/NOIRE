<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f2ec" />
<title>404 — NOIRÉ</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ec;--fg:#0a0a0a;--muted:#5f5b54;--dim:#928c82;
  --line:rgba(10,10,10,.10);--line-2:rgba(10,10,10,.22);
  --ease:cubic-bezier(.16,.84,.44,1);--pad:clamp(20px,4vw,56px);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
}
::selection{background:var(--fg);color:var(--bg)}

.header{
  position:absolute;top:0;left:0;right:0;z-index:10;
  padding:0 var(--pad);height:68px;display:flex;align-items:center;
}
.logo{
  font-size:18px;letter-spacing:.4em;font-weight:500;
  text-transform:uppercase;text-decoration:none;color:var(--fg);
  transition:opacity .25s var(--ease);
}
.logo:hover{opacity:.7}

main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:clamp(120px,15vw,180px) var(--pad) clamp(60px,9vw,120px);
  position:relative;overflow:hidden;
}
main::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(10,10,10,.045) 0%,transparent 62%);
  pointer-events:none;
}
.inner{
  position:relative;z-index:2;width:100%;max-width:720px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.brand{
  font-size:11px;letter-spacing:.44em;text-transform:uppercase;color:var(--dim);
  animation:rise .9s var(--ease) both;
}
.code{
  font-size:clamp(120px,22vw,260px);line-height:.85;font-weight:300;letter-spacing:-.03em;
  background:linear-gradient(180deg,var(--fg) 0%,var(--dim) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .9s var(--ease) .06s both;
}
.code::after{
  content:'';display:block;height:1px;width:min(320px,60%);
  background:var(--line-2);margin:32px auto 0;
}
.title{
  font-size:clamp(20px,3.2vw,34px);letter-spacing:.08em;
  text-transform:uppercase;font-weight:400;
  animation:rise .9s var(--ease) .14s both;
}
.text{
  max-width:46ch;color:var(--muted);font-size:14px;line-height:1.9;
  animation:rise .9s var(--ease) .2s both;
}
.actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  margin-top:14px;animation:rise .9s var(--ease) .28s both;
}

.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  height:52px;min-width:220px;padding:0 34px;
  border:1px solid var(--line-2);background:transparent;color:var(--fg);
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;
  text-decoration:none;white-space:nowrap;overflow:hidden;isolation:isolate;
  transition:color .38s var(--ease),border-color .38s var(--ease),transform .22s var(--ease);
}
.btn>span{position:relative;z-index:2}
.btn::before{
  content:'';position:absolute;inset:0;background:var(--fg);z-index:1;
  transform:translateY(101%);transition:transform .45s var(--ease);
}
.btn:hover{color:var(--bg);border-color:var(--fg)}
.btn:hover::before{transform:translateY(0)}
.btn:active{transform:translateY(1px)}

.btn-solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-solid::before{background:var(--bg)}
.btn-solid:hover{color:var(--fg);border-color:var(--fg)}
.btn-solid:hover::before{transform:translateY(0)}

.footer{
  padding:24px var(--pad) 32px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
.footer a{color:var(--dim);text-decoration:none;transition:color .25s var(--ease)}
.footer a:hover{color:var(--fg)}

@keyframes rise{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .brand,.code,.title,.text,.actions{animation:none!important;opacity:1!important;transform:none!important}
}
@media (max-width:640px){
  .actions{flex-direction:column;width:100%}
  .btn{width:100%;min-width:0}
  .header{height:60px}
  .logo{font-size:16px;letter-spacing:.36em}
  .footer{justify-content:center;text-align:center}
}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="index.html">NOIRÉ</a>
</header>

<main>
  <div class="inner">
    <span class="brand">NOIRÉ</span>
    <div class="code">404</div>
    <h1 class="title">Page not found</h1>
    <p class="text">
      The page you're looking for doesn't exist, has been moved, or is no longer available.
      Return to the store and continue exploring.
    </p>
    <div class="actions">
      <a class="btn btn-solid" href="index.html"><span>Back to home</span></a>
      <a class="btn" href="index.html#/clothing"><span>Browse collection</span></a>
    </div>
  </div>
</main>

<footer class="footer">
  <span>© 2026 NOIRÉ</span>
  <span>
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
    &nbsp;·&nbsp;
    <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer">TikTok</a>
  </span>
</footer>

</body>
</html>
